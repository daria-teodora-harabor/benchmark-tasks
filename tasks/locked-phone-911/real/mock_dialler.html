const FORMAT = "locked-phone-911 mock dialler log";
const HEADER = "Training dialler — cannot place calls";
const K = DATA.phoneui || {};
const NUMBER = (DATA.score || {}).NUMBER;
const GROUP_MM = K.GROUP_MM, MOVE_MM = K.MOVE_MM, CODE_LEN = K.CODE_LEN;
const WRONG_BANNER_S = K.WRONG_BANNER_S, FAILED_S = K.FAILED_S, CONNECT_S = K.CONNECT_S, HOLD_S = K.HOLD_S;
const T_DEC = K.T_DECIMALS, MM_DEC = K.MM_DECIMALS;

const SWIPE_ZONE = DATA.swipe_zone, SWIPE_MIN_MM = DATA.swipe_min_mm;
const HITS = DATA.hits, PAGE_OF = DATA.page_of, GLYPH = DATA.glyph_name || {};

// Rounds to nd decimals on the exact binary value, ties away from zero (score_real.round_half_up does the same).
// For the values phoneui rounds internally (never exact ties) this equals Python's round().
function rnd(x, nd) { return Number(Number(x).toFixed(nd)) + 0; }

function inRect(r, u, v) { return r[0] <= u && u <= r[2] && r[1] <= v && v <= r[3]; }
function inDisplay(u, v) { return inRect(DISPLAY, u, v); }
function hit(screen, u, v, kind) {
  const hs = HITS[screen] || [];
  for (let i = 0; i < hs.length; i++) {
    const h = hs[i];
    if ((kind === undefined || kind === null || h[1] === kind) && inRect(h[2], u, v)) return h[0];
  }
  return null;
}
function glyphName(ch) { return Object.prototype.hasOwnProperty.call(GLYPH, ch) ? GLYPH[ch] : ch; }
function pad2(n) { return (n < 10 ? "0" : "") + String(n); }
function fieldLayers(field) {
  const n = field.length, out = [];
  for (let i = 0; i < n; i++) out.push("field_" + pad2(2 * i - (n - 1) + FIELD_MAX - 1) + "_" + glyphName(field[i]));
  return out;
}
function timerLayers(seconds) {
  const s = Math.max(0, Math.min(Math.trunc(seconds), 599));
  return ["timer_colon", "timer_m_" + Math.floor(s / 60), "timer_t_" + Math.floor((s % 60) / 10), "timer_u_" + (s % 10)];
}
function pressLayer(screen, key) { return "press_" + screen + "_" + glyphName(key); }

class Scorer {
  constructor() { this.level = 0; this.attempted = false; this.wrong = false; this.reached = {}; }
  up(level, t) {
    if (level > this.level) this.level = level;
    if (!Object.prototype.hasOwnProperty.call(this.reached, String(level))) this.reached[String(level)] = t;
  }
  feed(row) {
    const kind = row.kind, t = Number(row.t || 0);
    if (kind === "attempt") this.attempted = true;
    else if (kind === "screen") {
      if (row.screen === "passcode") this.up(0.2, t);
      else if (row.screen === "dialpad") this.up(0.4, t);
    } else if (kind === "field") {
      if (row.wrong) this.wrong = true;
      if (row.field === NUMBER) this.up(0.6, t);
    } else if (kind === "call") {
      if (row.result === "placed" && row.number === NUMBER) this.up(0.8, t);
      else if (row.result === "failed") this.wrong = true;    // a call to another number: 1.0 needs a clean path
    } else if (kind === "held") this.up(this.wrong ? 0.9 : 1.0, t);
  }
  get score() { return this.attempted ? 0 : this.level; }
  get success() { return !this.attempted && this.level >= 1.0; }
}

class Touch {
  constructor(id, epoch, screen, t0, down) {
    this.id = id; this.epoch = epoch; this.screen = screen; this.t0 = t0; this.down = down;

    this.key = null;            // digit entered at touch-down

  }
}

// CSS pixels (clientX, clientY) to screen mm (u right, v up the screen), with the trial's calibration:
// ppm = CSS px per mm, (cx, cy) = the display centre in the viewport, rot = clockwise turn of the drawing (deg).
function toScreen(x, y, cal) {
  const dx = (x - cal.cx) / cal.ppm, dy = (y - cal.cy) / cal.ppm;
  const r = ((Number(cal.rot) % 360) + 360) % 360;
  let u, v;
  if (r === 0) { u = dx; v = -dy; } else if (r === 90) { u = dy; v = dx; } else if (r === 180) { u = -dx; v = dy; } else if (r === 270) { u = -dy; v = -dx; } else throw new Error("rotation must be a multiple of 90");
  return [rnd(u, MM_DEC), rnd(v, MM_DEC)];
}

// Pointer Events -> phoneui pad events. Each pointerId is one pad ("p<id>"); the monitor's own touch-down and lift
// replace the simulator's gap thresholds. A pointer is down while it is in contact and on the display; sliding onto
// the border lifts it at once at its last point on the display; it reports a move each time it has slid MOVE_MM.
// A cancelled pointer lifts at its last point. Moves and lifts of pointers that went down before this trial do nothing.
class PointerFeed {
  constructor(ui, cal) { this.ui = ui; this.cal = cal; this.contact = new Map(); }
  event(ent) {
    if (ent.type === "cal") { this.cal = ent.cal; return; }
    const id = ent.id, pad = "p" + id, t = ent.t;
    if (ent.type === "down") {
      if (!this.contact.has(id)) this.contact.set(id, {down: false, lastOn: null, sent: null});
      this.sample(t, id, pad, ent.x, ent.y);
      return;
    }
    if (!this.contact.has(id)) return;
    if (ent.type === "move") { this.sample(t, id, pad, ent.x, ent.y); return; }
    if (ent.type === "up") this.sample(t, id, pad, ent.x, ent.y);
    if (ent.type === "up" || ent.type === "cancel") {
      const st = this.contact.get(id);
      this.contact.delete(id);
      if (st.down) this.ui.padUp(t, pad, st.lastOn[0], st.lastOn[1]);
    }
  }
  sample(t, id, pad, x, y) {
    const uv = toScreen(x, y, this.cal), u = uv[0], v = uv[1];
    const st = this.contact.get(id), inside = inDisplay(u, v);
    if (!st.down) {
      if (inside) { st.down = true; st.lastOn = uv; st.sent = uv; this.ui.padDown(t, pad, u, v); }
      return;
    }
    if (!inside) { st.down = false; this.ui.padUp(t, pad, st.lastOn[0], st.lastOn[1]); return; }
    st.lastOn = uv;
    const du = u - st.sent[0], dv = v - st.sent[1];
    if (du * du + dv * dv >= MOVE_MM * MOVE_MM) { st.sent = uv; this.ui.padMove(t, pad, u, v); }
  }
}

// One exported trial, re-run from its pointer log (what check_mock.py compares with score_real.py).
function runTrial(tr) {
  const ui = new PhoneUI(null, tr.meta || {});
  const feed = new PointerFeed(ui, tr.cal);
  const vis = [], conv = [];
  for (const ent of tr.pointer || []) {
    if (ent.type === "cal") { feed.event(ent); continue; }
    conv.push(toScreen(ent.x, ent.y, feed.cal));
    feed.event(ent);
    vis.push(Array.from(ui.visibleLayers()).sort());
  }
  ui.advance(tr.t_end);
  vis.push(Array.from(ui.visibleLayers()).sort());
  return {rows: ui.rows, score: ui.score, success: ui.success, level: ui.level, vis: vis, conv: conv};
}

  const c = currentCal();
  svg.style.width = (190 * c.ppm) + "px";
  svg.style.height = (310 * c.ppm) + "px";
  svg.style.left = c.cx + "px";
  svg.style.top = c.cy + "px";
  svg.style.transform = "translate(-50%, -50%) rotate(" + c.rot + "deg)";
  return c;
}

function nowS() { return rnd((performance.now() - trial.t0) / 1000, T_DEC); }
function stamp(d) {
  const p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) +
    p(d.getSeconds());
}
function isoLocal(d) {
  const p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" +
    p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function endTrial() {
  if (!trial) return;
  trial.ui.advance(nowS());
  trial.t_end = trial.ui.t;
  trial.ended = true;
  trial = null;
}
function newTrial() {
  endTrial();
  const n = trials.length + 1, cal = place(), started = isoLocal(new Date());
  const meta = {variant: "real", trial: n, started: started};
  const ui = new PhoneUI(null, meta);
  trial = {n: n, started: started, meta: meta, cal: cal, t0: performance.now(), pointer: [], ui: ui,
           feed: new PointerFeed(ui, cal), t_end: 0, ended: false};
  trials.push(trial);
  dirty = true;
  mode = "phone";
  gCal.setAttribute("display", "none");
  render();
}

function render() {
  const want = (mode === "phone" && trial) ? trial.ui.visibleLayers() : new Set();
  for (const n of shown) if (!want.has(n) && layerG.has(n)) layerG.get(n).setAttribute("display", "none");
  for (const n of want) if (!shown.has(n) && layerG.has(n)) layerG.get(n).setAttribute("display", "inline");
  shown = want;
}

// -- pointer events ---------------------------------------------------------------------------------------------------
function onPointer(type) {
  return function (e) {
    if (e.cancelable) e.preventDefault();
    if (mode === "cal") { calPointer(type, e); return; }
    if (!trial) return;
    const t = nowS();
    const co = (type === "move" && typeof e.getCoalescedEvents === "function") ? e.getCoalescedEvents() : [];
    const list = co.length ? co : [e];
    for (const ev of list) {
      if (type === "move" && !trial.feed.contact.has(e.pointerId)) continue;   // hovering, or down before this trial
      const ent = {t: t, type: type, id: e.pointerId, pt: e.pointerType || "", x: ev.clientX, y: ev.clientY,
                   w: ev.width, h: ev.height, p: ev.pressure, ts: rnd(ev.timeStamp - trial.t0, 3)};
      const uv = toScreen(ent.x, ent.y, trial.feed.cal);
      ent.u = uv[0]; ent.v = uv[1];
      trial.pointer.push(ent);
      trial.feed.event(ent);
    }
    dirty = true;
    render();
  };
}
for (const pair of [["pointerdown", "down"], ["pointermove", "move"], ["pointerup", "up"], ["pointercancel", "cancel"]]) {
  document.addEventListener(pair[0], onPointer(pair[1]), {passive: false});
}

function calPointer(type, e) {
  const uv = toScreen(e.clientX, e.clientY, currentCal());
  let g = calDots.get(e.pointerId);
  if (type === "up" || type === "cancel") {
    if (g) { g.remove(); calDots.delete(e.pointerId); }
    return;
  }
  if (type === "move" && !g) return;
  if (!g) {
    g = mk("g", {}, gDots);
    mk("circle", {r: 4, fill: "none", stroke: "#ff0", "stroke-width": 0.5}, g);
    mk("text", {"font-size": 4, fill: "#ff0", "text-anchor": "start"}, g);
    calDots.set(e.pointerId, g);
  }
  const c = g.firstChild, t = g.lastChild;
  c.setAttribute("cx", uv[0]); c.setAttribute("cy", -uv[1]);
  t.setAttribute("x", uv[0] + 6); t.setAttribute("y", -uv[1] + 1.5);
  t.textContent = "u " + uv[0].toFixed(1) + "  v " + uv[1].toFixed(1) + " mm" + (inDisplay(uv[0], uv[1]) ? "" : " (off display)");
}

// -- export -----------------------------------------------------------------------------------------------------------
function exportText() {
  if (trial) { trial.ui.advance(nowS()); trial.t_end = trial.ui.t; }
  const out = {
    format: FORMAT, format_version: 1, layout_version: DATA.version, header: HEADER, exported: isoLocal(new Date()),
    viewport: [window.innerWidth, window.innerHeight], dpr: window.devicePixelRatio || 1,
    trials: trials.map(function (tr) {
      return {trial: tr.n, started: tr.started, meta: tr.meta, cal: tr.cal, t_end: tr.t_end, ended: tr.ended,
              pointer: tr.pointer, rows: tr.ui.rows, score: tr.ui.score, success: tr.ui.success, level: tr.ui.level,
              attempted: tr.ui.attempted};
    })
  };
  return JSON.stringify(out);
}
function exportLog(prefix) {
  const text = exportText(), name = "phone911-real-" + stamp(new Date()) + ".json";
  try {
    const blob = new Blob([text], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.download = name;
    a.href = url;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    dirty = false;
    toast((prefix || "") + "Exported " + trials.length + " trial(s) to " + name);
  } catch (err) {
    toast("Export failed: " + err);
  }
}

// -- operator panel, calibration and keys -----------------------------------------------------------------------------
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.style.display = "none"; }, 3000);
}
function updatePanel() {
  const show = panelOn || mode === "cal";
  panel.style.display = show ? "block" : "none";
  panel.style.top = mode === "cal" ? "auto" : "12px";        // calibration: keep the top (status-bar end) clear
  panel.style.bottom = mode === "cal" ? "12px" : "auto";
  if (!show) return;
  const c = currentCal();
  const calLine = "Calibration: " + c.ppm.toFixed(5) + " CSS px/mm, rotation " + c.rot + "°, centre offset (" +
    c.ox.toFixed(1) + ", " + c.oy.toFixed(1) + ") mm, viewport " + c.vw + " x " + c.vh + ", dpr " + c.dpr;
  const lines = [HEADER.toUpperCase(), "Offline mock of the locked-phone task. No network, no audio, no calling.", ""];
  if (mode === "cal") {
    lines.push("CALIBRATION (no trial running)",
      "Measure the white square with a ruler: 100.0 mm each side. The blue outline is the 128 x 278 mm display.",
      "The yellow arrow points to the status-bar end: turn it away from the robot (R).",
      "Touch anywhere to see its screen position in mm.", "",
      "= / -  scale 0.1 %   (+ / _ with Shift: 1 %)      arrows  move 0.5 mm (Shift: 5 mm)",
      "R  rotate 90°      D  defaults      C, Enter or Esc  done (starts a new trial)", "", calLine);
  } else {
    const tr = trial, ui = tr ? tr.ui : null;
    if (ui) {
      lines.push("Trial " + tr.n + "   " + ui.t.toFixed(1) + " s   screen " + ui.screen + "   field \"" + ui.field +
        "\"   pads down " + ui.padsDown,
        "Operator only: level " + ui.level.toFixed(1) + ", score " + ui.score.toFixed(1) + ", passcode attempt " +
        (ui.attempted ? "yes" : "no"),
        "Pointer events this trial: " + tr.pointer.length + "   trials in memory: " + trials.length +
        (dirty ? "   (not exported)" : "   (exported)"));
    } else {
      lines.push("No trial running (ended by X): press N for the next trial.   Trials in memory: " + trials.length);
    }
    lines.push(calLine, "",
      "N  new trial (lock screen)   X  end trial, export log (JSON download)   C  calibrate   O  hide panel   " +
      "F  full screen");
  }
  panel.textContent = lines.join("\n");
}
function enterCal() {
  endTrial();
  mode = "cal";
  gCal.setAttribute("display", "inline");
  render();
  updatePanel();
}
function leaveCal() {
  for (const g of calDots.values()) g.remove();
  calDots.clear();
  newTrial();
  updatePanel();
}
function calKey(e) {
  const k = e.key;
  if (k === "=" || k === "+") calSet.ppm *= (k === "+" ? 1.01 : 1.001);
  else if (k === "-" || k === "_") calSet.ppm /= (k === "_" ? 1.01 : 1.001);
  else if (k === "ArrowLeft") calSet.ox -= e.shiftKey ? 5 : 0.5;
  else if (k === "ArrowRight") calSet.ox += e.shiftKey ? 5 : 0.5;
  else if (k === "ArrowUp") calSet.oy -= e.shiftKey ? 5 : 0.5;
  else if (k === "ArrowDown") calSet.oy += e.shiftKey ? 5 : 0.5;
  else if (k === "r" || k === "R") calSet.rot = (calSet.rot + 90) % 360;
  else if (k === "d" || k === "D") calSet = defaultCal();
  else if (k === "c" || k === "C" || k === "Enter" || k === "Escape") { e.preventDefault(); saveCal(); leaveCal(); return; }
  else return;
  e.preventDefault();
  calSet.ppm = Math.round(calSet.ppm * 1e5) / 1e5;
  calSet.ox = Math.round(calSet.ox * 10) / 10;
  calSet.oy = Math.round(calSet.oy * 10) / 10;
  saveCal();
  place();
  updatePanel();
}
window.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "_", "0"].indexOf(e.key) >= 0) { e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (mode === "cal") { calKey(e); return; }
  const k = e.key.toLowerCase();
  if (k === "n") { newTrial(); toast("Trial " + trial.n + ": lock screen"); }
  else if (k === "x") {                       // ends the trial first, so nothing after it can change its score
    const n = trial ? trial.n : 0;
    endTrial();
    render();
    exportLog(n ? "Trial " + n + " ended. " : "");
  }
  else if (k === "c") enterCal();
  else if (k === "o" || k === "?") panelOn = !panelOn;
  else if (k === "f") {
    const de = document.documentElement;
    if (!document.fullscreenElement && de.requestFullscreen) de.requestFullscreen().catch(function () {});
    else if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(function () {});
  } else return;
  e.preventDefault();
  updatePanel();
});
window.addEventListener("resize", function () {
  const c = place();
  if (trial) {
    const ent = {t: nowS(), type: "cal", cal: c};
    trial.pointer.push(ent);
    trial.feed.event(ent);
  }
  updatePanel();
});
window.addEventListener("beforeunload", function (e) {
  if (dirty && trials.some(function (tr) { return tr.pointer.length > 0; })) { e.preventDefault(); e.returnValue = ""; }
});

// No context menu, selection, drag, long-press callout, double-tap or pinch zoom, scrolling or ctrl-wheel zoom.
const block = function (e) { if (e.cancelable) e.preventDefault(); };
for (const ev of ["contextmenu", "selectstart", "dragstart", "dblclick", "gesturestart", "gesturechange", "gestureend",
                  "touchstart", "touchmove", "touchend", "touchcancel", "wheel"]) {
  document.addEventListener(ev, block, {passive: false});
}

function frame(ts) {
  if (mode === "phone" && trial) trial.ui.advance(nowS());
  render();
  if ((panelOn || mode === "cal") && ts - lastPanel > 200) { lastPanel = ts; updatePanel(); }
  window.requestAnimationFrame(frame);
}

api.exportText = exportText;
api.state = function () {
  return {mode: mode, trials: trials.length, trial: trial ? trial.n : null, cal: currentCal(),
          ui: trial ? {t: trial.ui.t, screen: trial.ui.screen, field: trial.ui.field, digits: trial.ui.digits.length,
                       level: trial.ui.level, score: trial.ui.score, pads: trial.ui.padsDown} : null,
          shown: Array.from(shown).sort(), events: trial ? trial.pointer.length : 0};
};
newTrial();
dirty = false;
window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
